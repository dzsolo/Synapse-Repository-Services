<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#pageTitle#</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
    <tr>
      <td align="center">

        <!--
          600px email container.
          The header graphic (600x223px, angled bottom edge) is used as
          background-image so it bleeds edge-to-edge and the gradient shows
          through the 40px side gutters, behind the white card.
        -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" role="presentation"
               style="max-width: 600px; width: 100%;
                      background-image: url('#imageBaseUrl#/shared/banner-background.png');
                      background-size: 600px 223px;
                      background-repeat: no-repeat;
                      background-position: top center;
                      background-color: #d7dee4;">

          <!-- Logo bar — sits on top of the dark gradient -->
          <tr>
            <td style="padding: 18px 40px 22px 40px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
                <tr>
                  <td valign="middle">
                    <!-- Synapse logo: mark + type -->
                    <img src="#imageBaseUrl#/shared/logo-mark.png" alt="" width="31" height="31" style="display: inline-block; vertical-align: middle;">
                    <img src="#imageBaseUrl#/shared/logo-wordmark.png" alt="SYNAPSE" width="124" height="17" style="display: inline-block; vertical-align: middle; margin-left: 13px;">
                  </td>
                  <td align="right" valign="middle">
                    <a href="https://www.synapse.org" style="color: #ffffff; font-size: 14px; font-family: Arial, Helvetica, sans-serif; font-weight: normal; line-height: 20px; text-decoration: none;">synapse.org</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!--
            White content card.
            40px left/right padding creates gutters that reveal the dark
            gradient background-image behind the card. The card itself has
            a white background that covers the gradient in the centre column.
          -->
          <tr>
            <td style="padding: 0 40px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
                <tr>
                  <td style="background-color: #ffffff; padding: 32px 40px 32px 40px;">

                    #content#

                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 24px 40px 40px 40px;">
              <p style="margin: 0 0 24px 0; font-size: 12px; font-style: italic; color: #4a5056; font-family: Arial, Helvetica, sans-serif; line-height: 20px;">Powered by Sage Bionetworks</p>
              <!-- Social icons -->
              <table cellpadding="0" cellspacing="0" border="0" role="presentation">
                <tr>
                  <td style="padding-right: 17px;">
                    <a href="https://www.facebook.com/sagebionetworks/" style="display: block; text-decoration: none;">
                      <img src="#imageBaseUrl#/shared/social-facebook.png" alt="Facebook" width="20" height="20" style="display: block;">
                    </a>
                  </td>
                  <td style="padding-right: 17px;">
                    <a href="https://www.linkedin.com/company/sage-bionetworks" style="display: block; text-decoration: none;">
                      <img src="#imageBaseUrl#/shared/social-linkedin.png" alt="LinkedIn" width="20" height="20" style="display: block;">
                    </a>
                  </td>
                  <td>
                    <a href="https://twitter.com/sagebio" style="display: block; text-decoration: none;">
                      <img src="#imageBaseUrl#/shared/social-x.png" alt="X (Twitter)" width="20" height="20" style="display: block;">
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- End email container -->

      </td>
    </tr>
  </table>

</body>
</html>
